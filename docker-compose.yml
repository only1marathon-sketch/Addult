services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8080:8080"   # the only public port; put HTTPS (Caddy/Nginx/Cloudflare) in front
    volumes:
      - appdata:/app/data
    depends_on: [image-worker, chat]

  image-worker:
    build: ./worker
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN}
      BASE_MODEL: ${BASE_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./loras:/loras:ro
      - hfcache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  chat:
    image: vllm/vllm-openai:latest
    command: ["--model", "${CHAT_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}", "--max-model-len", "8192"]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hfcache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  appdata:
  hfcache:
